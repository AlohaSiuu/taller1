<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <!-- Incluye el CSS de Bootstrap desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Reservas Restaurante</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#features">Características</a></li>
                    <li class="nav-item"><a class="nav-link" href="#reserva">Reservar</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/list">Lista de Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/form">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario de Registro -->
    <div class="form-container mt-5">
        <h2 class="title-h2">Registro de Cliente</h2>
        <form id="registroForm">

            <div class="form-group mb-3">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>

            <div class="form-group mb-3">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="form-group mb-3">
                <label for="telefono">Teléfono</label>
                <input type="number" id="telefono" class="form-control" required>
            </div>

            <div class="form-group mb-3">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Registrar</button>
        </form>

        <!-- Mensaje de respuesta -->
        <div id="mensaje" class="mt-3"></div>
    </div>

    <!-- Footer -->
    <footer id="contacto" class="py-4 fixed-bottom">
        <div class="container-footer text-center">
            <p>© 2024 Reservas Restaurante. Todos los derechos reservados.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com" target="_blank" class="text-white mx-3" title="Facebook">
                    <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://www.instagram.com" target="_blank" class="text-white mx-3" title="Instagram">
                    <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
                </a>
                <a href="mailto:info@reservarestaurante.com" class="text-white mx-3" title="Correo Electrónico">
                    <i class="bi bi-envelope" style="font-size: 1.5rem;"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Incluye el JS de Bootstrap y Popper.js desde CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Js del formulario -->
    <script src="js/form.js"></script>
</body>
</html>
