<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Reservas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/list.css">
	<link rel="stylesheet" href="css/icons.css">
</head>
<body>
	<!-- Barra de navegación -->
	  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	      <div class="container">
	          <a class="navbar-brand" href="/">Reservas Restaurante</a>
	          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
	              <span class="navbar-toggler-icon"></span>
	          </button>
	          <div class="collapse navbar-collapse" id="navbarNav">
	              <ul class="navbar-nav ms-auto">
	                  <li class="nav-item"><a class="nav-link active" href="/">Inicio</a></li>
	                  <li class="nav-item"><a class="nav-link" href="#features">Características</a></li>
	                  <li class="nav-item"><a class="nav-link" href="#reserva">Reservar</a></li>
	                  <li class="nav-item"><a class="nav-link" href="/list">Lista de reservas</a></li>
	                  <li class="nav-item"><a class="nav-link" href="/form">Registrarse</a></li>
	          </div>
	      </div>
	  </nav>

    <!-- Lista de Reservas -->
    <main class="container mt-5">
        <h2 class="title-h2">Lista de Reservas</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Fecha y Hora</th>
                    <th>Número de Personas</th>
                    <th>Mesa</th>
                </tr>
            </thead>
            <tbody id="reservas-list">
            </tbody>
        </table>
    </main>

    <!-- Footer -->
    <footer id="contacto" class="py-4  mt-5">
        <div class="container-footer text-center">
            <p>© 2024 Reservas Restaurante. Todos los derechos reservados.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com" target="_blank" class="text-white mx-3" title="Facebook">
                    <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
                </a>
                <a href="https://www.instagram.com" target="_blank" class="text-white mx-3" title="Instagram">
                    <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
                </a>
                <a href="mailto:info@reservarestaurante.com" class="text-white mx-3" title="Correo Electrónico">
                    <i class="bi bi-envelope" style="font-size: 1.5rem;"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/list.js"></script>
